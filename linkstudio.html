<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Editor maestro público · PrintsNCode</title>
<link rel="icon" href="data:,">
<style>:root{color-scheme:dark;--bg:#0b0c0e;--panel:#131518;--panel2:#1a1d20;--panel3:#22262a;--line:#2b2f33;--line2:#3a3f45;--text:#f2f2ef;--muted:#9b9fa3;--dim:#6e7378;--red:#fc1f28;--red2:#ff4b52;--ok:#39c07f;--mono:"SFMono-Regular",ui-monospace,Menlo,monospace;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:#0e0f11}
.brand{font:800 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.02em;white-space:nowrap}.brand i{font-style:normal;color:var(--red)}.brand span{color:var(--muted);font-weight:500;margin-left:6px}
.pages{display:flex;gap:4px;margin-left:18px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pages button{border:0;background:none;padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:600}
.pages button[aria-pressed=true]{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font-weight:600;white-space:nowrap}
.btn:hover{border-color:#555b62;background:var(--panel3)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red2)}
.btn.icon{width:34px;padding:0;justify-content:center;font-size:15px}
.menu{position:relative}.menu-pop{position:absolute;right:0;top:40px;z-index:40;min-width:250px;padding:6px;border:1px solid var(--line2);border-radius:10px;background:#16181b;box-shadow:0 18px 50px #000a;display:none}
.menu.open .menu-pop{display:block}.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px}.menu-pop button:hover{background:var(--panel3)}.menu-pop small{display:block;color:var(--muted);font-size:11px}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.layout{display:grid;grid-template-columns:400px minmax(0,1fr);height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.side-head input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#0f1113}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:8px;background:#0f1113}.seg button{border:0;background:none;padding:5px 9px;border-radius:6px;color:var(--muted);font-weight:700;font-size:11px}.seg button[aria-pressed=true]{background:var(--panel3);color:var(--text)}
#panels{overflow:auto;flex:1;padding:8px 10px 60px;scrollbar-width:thin}
details.panel{border:1px solid var(--line);border-radius:11px;background:#15171a;margin:0 0 8px}
details.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;font-weight:700;user-select:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .ico{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--panel3);font-size:13px}
details.panel>summary .ttl{flex:1}details.panel>summary small{color:var(--dim);font-weight:500;font-size:11px}
details.panel>summary:after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-left:6px;transition:transform .2s}
details.panel[open]>summary:after{transform:rotate(45deg)}
details.panel[open]>summary{border-bottom:1px solid var(--line)}
.pbody{padding:12px 13px 14px;display:grid;gap:11px}
.hint{margin:0;color:var(--muted);font-size:12px}
.field{display:grid;gap:5px;min-width:0}.field>label,.lbl{color:#c9ccce;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.field>label .loc{font:700 9px var(--mono);padding:2px 5px;border-radius:4px;background:#2a1113;color:#ff9aa0;letter-spacing:.05em}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea,.field select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#0f1113;outline:none}
.field textarea{min-height:74px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#6b7178;box-shadow:0 0 0 3px #fc1f281a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0;cursor:pointer;font-weight:600;color:#d7d9db;font-size:12.5px}
.toggle input{appearance:none;width:34px;height:20px;border-radius:20px;background:#34383d;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.toggle input:before{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#dfe1e3;transition:transform .2s}
.toggle input:checked{background:var(--red)}.toggle input:checked:before{transform:translateX(14px)}
.color{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:#0f1113}
.color input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer;flex:none}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}.color input[type=color]::-webkit-color-swatch{border:1px solid #fff3;border-radius:6px}
.color input[type=text]{border:0!important;background:none!important;padding:2px!important;font:12px var(--mono);box-shadow:none!important}
.color span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.range{display:flex;align-items:center;gap:10px}.range input[type=range]{flex:1;accent-color:var(--red)}.range output{min-width:62px;text-align:right;font:11px var(--mono);color:var(--muted)}
.img{display:flex;gap:10px;align-items:center;padding:8px;border:1px dashed var(--line2);border-radius:9px;background:#0f1113}
.img .thumb{width:64px;height:52px;flex:none;border-radius:6px;background:#1b1e21 repeating-conic-gradient(#202326 0 25%,#181a1d 0 50%) 0 0/12px 12px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.img .thumb img{max-width:100%;max-height:100%;object-fit:contain}.img .thumb em{color:var(--dim);font-size:10px;font-style:normal}
.img .acts{display:flex;flex-wrap:wrap;gap:5px}.img .meta{font:10.5px var(--mono);color:var(--dim);margin-top:4px;word-break:break-all}
.sbtn{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);font-size:12px;font-weight:600}
.sbtn:hover{background:var(--panel3)}.sbtn.danger{color:#ff9095}.sbtn.danger:hover{background:#3a1215;border-color:#6d2227}.sbtn.acc{border-color:#7a2a2e;background:#2a1214;color:#ffb3b6}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.list{display:grid;gap:6px}
.item{border:1px solid var(--line);border-radius:9px;background:#101214;min-width:0}
.item.hidden-item{opacity:.55}.item.dragging{opacity:.4}.item.dropover{border-color:var(--red)}
.ihead{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;cursor:pointer;min-width:0}
.ihead .grip{cursor:grab;color:var(--dim);font-size:13px;padding:0 2px;user-select:none}
.ihead .ith{width:34px;height:30px;flex:none;border-radius:5px;background:#1b1e21;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.ihead .ith img{max-width:100%;max-height:100%;object-fit:contain}.ihead .ith svg{width:16px;height:16px}
.ihead .ititle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:12.5px}
.ihead .ititle small{color:var(--dim);font-weight:500;margin-left:6px}
.iacts{display:flex;gap:1px}.iacts button{width:25px;height:25px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:12px;display:grid;place-items:center}
.iacts button:hover{background:var(--panel3);color:var(--text)}.iacts button.d:hover{background:#3a1215;color:#ff8d92}
.ibody{display:none;padding:4px 10px 12px;gap:10px;border-top:1px solid var(--line)}.item.open>.ibody{display:grid}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.sub{padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d0f11;display:grid;gap:9px}
.sub>h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash{animation:flash 1.3s ease}@keyframes flash{0%,40%{box-shadow:0 0 0 3px #fc1f2866;border-color:var(--red)}100%{box-shadow:none}}
.preview{display:flex;flex-direction:column;min-width:0;min-height:0;background:#08090a}
.pbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:#0e0f11}
.pbar .status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.pbar .status.saved:before{content:"●";color:var(--ok);margin-right:6px}
.stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px;background:radial-gradient(60% 50% at 50% 0,#1a1c20,#08090a)}
.framebox{position:relative;flex:none;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #2b2f33,0 30px 80px #000c;background:#111;transform-origin:top center}
.framebox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111;opacity:0;pointer-events:none}
.framebox iframe.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:90;padding:11px 16px;border-radius:10px;background:#1c1f23;border:1px solid var(--line2);box-shadow:0 18px 40px #000b;transition:.25s;pointer-events:none;font-weight:600;max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:#7a2a2e;color:#ffb3b6}
dialog{border:1px solid var(--line2);border-radius:14px;background:#131518;color:var(--text);padding:0;width:min(760px,92vw);max-height:84vh;box-shadow:0 30px 80px #000c}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.dhead h3{margin:0;font-size:15px}.dhead .spacer{flex:1}
.dbody{padding:14px 16px;overflow:auto;max-height:calc(84vh - 60px)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.lib figure{margin:0;border:1px solid var(--line);border-radius:9px;background:#0f1113;overflow:hidden;cursor:pointer;position:relative}
.lib figure:hover{border-color:var(--red)}
.lib figure div{height:86px;display:grid;place-items:center;background:repeating-conic-gradient(#1c1f22 0 25%,#16181b 0 50%) 0 0/14px 14px}
.lib figure img{max-width:100%;max-height:86px;object-fit:contain}
.lib figcaption{padding:6px 7px;font:10px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .unused{position:absolute;top:5px;left:5px;font:700 9px var(--mono);padding:2px 5px;border-radius:4px;background:#000b;color:#ffcf6b}
.lib .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:#000b;color:#ff9095;display:none}.lib figure:hover .rm{display:block}
.empty{padding:14px;border:1px dashed var(--line2);border-radius:9px;color:var(--muted);text-align:center;font-size:12px}
.note{padding:9px 11px;border-radius:8px;background:#1b1508;border:1px solid #4a3a12;color:#e8c979;font-size:12px}
.kbd{font:10px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:48vh 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.top{overflow-x:auto}.brand span{display:none}}

.hist{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.hist .btn{height:30px;border-color:transparent;background:none}.hist .btn:not(:disabled):hover{background:var(--panel3)}
.hist-pop{left:50%;right:auto;transform:translateX(-50%);width:320px;max-height:60vh;overflow:auto}
.hist-pop .hstep{display:flex;gap:8px;align-items:baseline}.hist-pop .hstep i{font-style:normal;font:10px var(--mono);color:var(--dim);min-width:22px}
.hist-pop .hstep.cur{background:#2a1214;color:#ffb3b6}.hist-pop .hstep.fut{opacity:.55}
#compareBtn.on{background:#2a1214;border-color:var(--red);color:#ffb3b6}
.cmpbadge{position:fixed;left:calc(50% + 200px);bottom:26px;transform:translateX(-50%);z-index:80;padding:8px 14px;border-radius:999px;background:#fc1f28;color:#fff;font-weight:600;font-size:12px;box-shadow:0 10px 30px #000a;display:none;pointer-events:none}
.cmpbadge.on{display:block}
@media(max-width:1250px){#undo,#redo{font-size:0;width:34px;padding:0;justify-content:center}#undo:before{content:"↶";font-size:15px}#redo:before{content:"↷";font-size:15px}#compareBtn{font-size:0;width:34px;padding:0;justify-content:center}#compareBtn:before{content:"◑";font-size:15px}}

.eye{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;padding:1px 6px;border-radius:6px;cursor:pointer;font-weight:600}
.eye:hover{background:var(--panel3);color:var(--text)}.eye.off{color:#ffcf6b;background:#2b2210}
.field.is-hidden .img,.field.is-hidden input,.field.is-hidden textarea,.sub.is-hidden .row3{opacity:.45}
.h4row{display:flex;align-items:center;gap:6px}
.hidbox{margin:0 0 10px;padding:10px;border:1px solid #4a3a12;border-radius:11px;background:#171206}
.hidhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.hidhead b{color:#ffcf6b}.hidhead span{color:#b9a473;font-size:11.5px;flex:1;min-width:140px}
.hidlist{display:grid;gap:4px;margin-top:8px;max-height:190px;overflow:auto}
.hidrow{display:flex;align-items:center;gap:6px;font-size:12px}.hidrow .sbtn{flex:none;height:24px;padding:0 8px}.hidrow span{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e6d3a3}
.row .range{gap:6px}.row .range output{min-width:46px;font-size:10px}
.range input[type=range]{min-width:0;width:100%}.row .range output{min-width:0;flex:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Editor maestro público<span>Creado por PrintsNCode</span></div>
  <div class="pages" role="tablist" aria-label="Página que editas">
    <button type="button" data-page="site" aria-pressed="true">Web principal</button>
    <button type="button" data-page="link" aria-pressed="false">Link</button>
  </div>
  <div class="spacer"></div>
  <div class="hist">
    <button class="btn" id="undo" title="Deshacer el último cambio (Ctrl/Cmd+Z)" disabled>↶ Atrás</button>
    <div class="menu" id="histMenu"><button class="btn icon" id="histBtn" title="Historial de cambios">⋯</button><div class="menu-pop hist-pop" id="histPop"></div></div>
    <button class="btn" id="redo" title="Volver a aplicar el cambio (Ctrl/Cmd+Shift+Z)" disabled>Adelante ↷</button>
  </div>
  <button class="btn" id="compareBtn" title="Mantén pulsado (o pulsa) para ver cómo estaba antes del último cambio" disabled>◑ Antes / después</button>
  <div class="menu" id="restoreMenu">
    <button class="btn" id="restoreBtn" title="Volver a los datos de ejemplo originales">⟲ Restaurar ▾</button>
    <div class="menu-pop">
      <button data-restore="page"><b id="restorePageLabel">Restaurar esta página</b><small>Vuelve a los datos de ejemplo originales solo aquí</small></button>
      <button data-restore="site"><b>Restaurar la web principal</b><small>index.html vuelve al ejemplo original</small></button>
      <button data-restore="link"><b>Restaurar la página Link</b><small>link/index.html vuelve al ejemplo original</small></button>
      <hr>
      <button data-restore="all"><b>Restaurar todo</b><small>Web + Link + imágenes del ejemplo. Se puede deshacer con «Atrás».</small></button>
    </div>
  </div>
  <button class="btn" id="importBtn" title="Cargar index.html, link/index.html o un proyecto .json">Importar</button>
  <div class="menu" id="exportMenu">
    <button class="btn primary" id="exportBtn">Exportar ▾</button>
    <div class="menu-pop">
      <button data-exp="site"><b>index.html</b><small>Web principal lista para publicar</small></button>
      <button data-exp="link"><b>link/index.html</b><small>Página de enlaces preparada para la carpeta link</small></button>
      <button data-exp="json"><b>proyecto.json</b><small>Copia completa para volver a editar</small></button>
      <hr>
      <button data-exp="folder"><b>Guardar todo en una carpeta…</b><small>Escribe los tres archivos a la vez (Chrome/Edge)</small></button>
      <button data-exp="all"><b>Descargar los tres archivos</b><small>index.html + link-index.html + proyecto.json</small></button>
    </div>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="side-head">
      <input id="search" type="search" placeholder="Buscar ajuste… (logo, fondo, intro…)" aria-label="Buscar ajuste">
      <div class="seg" id="localeSeg" title="Idioma de los textos que editas">
        <button type="button" data-loc="es" aria-pressed="true">ES</button>
        <button type="button" data-loc="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div id="panels"></div>
  </aside>
  <main class="preview">
    <div class="pbar">
      <div class="seg" id="deviceSeg">
        <button type="button" data-dev="desktop" aria-pressed="true">Escritorio</button>
        <button type="button" data-dev="tablet" aria-pressed="false">Tablet</button>
        <button type="button" data-dev="mobile" aria-pressed="false">Móvil</button>
      </div>
      <div class="seg" id="themeSeg" title="Tema de la vista previa">
        <button type="button" data-th="light" aria-pressed="true">☀ Claro</button>
        <button type="button" data-th="dark" aria-pressed="false">☾ Oscuro</button>
      </div>
      <div class="seg" id="modeSeg" title="Editar al hacer clic o navegar por la página">
        <button type="button" data-mode="edit" aria-pressed="true">✎ Editar</button>
        <button type="button" data-mode="nav" aria-pressed="false">↗ Navegar</button>
      </div>
      <button class="sbtn" id="playIntro" type="button">▶ Ver intro</button>
      <span class="status" id="status" role="status">Preparando…</span>
    </div>
    <div class="stage" id="stage"><div class="framebox" id="framebox"><iframe id="fa" class="on" title="Vista previa"></iframe><iframe id="fb" title="Vista previa (carga)"></iframe></div></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="cmpbadge" id="cmpBadge">Viendo <b>ANTES</b> del cambio · suelta o pulsa de nuevo para volver</div>
<input type="file" id="fileImport" accept=".html,.htm,.json,text/html,application/json" multiple hidden>
<input type="file" id="fileImage" accept="image/*" hidden>

        fNumber('Altura mínima', 'link.buttons.height', { min: 36, max: 80, unit: ' px' }),
        fNumber('Tamaño de letra', 'link.buttons.fontSize', { min: 11, max: 22, unit: ' px' }),
        fSelect('Forma de las celdas', 'link.buttons.tileShape', [['leaf', 'Hoja (original)'], ['rounded', 'Redondeada'], ['soft', 'Suave'], ['square', 'Cuadrada'], ['circle', 'Círculo']], { structure: false }),
        row(fNumber('Columnas', 'link.buttons.cols', { min: 2, max: 6 }), fNumber('Columnas en móvil', 'link.buttons.mobileCols', { min: 2, max: 6 })),
        fToggle('Nombre bajo cada celda', 'link.buttons.labels', { structure: false }))),
      panel('lpartners', '✦', 'Colaboradores', K.partners.visible === false ? 'ocultos' : (K.partners.mode === 'custom' ? 'lista propia' : 'sincronizados'), (b) => {

  function renderPanels() {
    const host = $('#panels'); const y = host.scrollTop;
    const act = document.activeElement; const actBind = act && host.contains(act) ? act.getAttribute('data-bind') : null;
    const intro = h('div', { class: 'hint', style: 'padding:2px 4px 10px' }, App.page === 'site' ? 'Demo con datos ficticios y enlaces vacíos. Edita aquí tu web. Guarda el JSON como copia privada y exporta los HTML para publicar.' : 'Estás editando link/index.html. Haz clic en la vista previa para cambiar textos e imágenes; los bloques se ordenan aquí.');
    host.replaceChildren(intro, hiddenBox() || '', ...(App.page === 'site' ? sitePanels() : linkPanels()));
    applySearch();
    host.scrollTop = y;
    if (actBind) { const el = host.querySelector(`[data-bind="${CSS.escape(actBind)}"]`); if (el) el.focus(); }
    $('#localeSeg').style.visibility = App.page === 'site' && App.state.site.i18n.locales.length > 1 ? 'visible' : 'hidden';
  }
  function applySearch() {
    const q = $('#search').value.trim().toLowerCase();
    $$('#panels details.panel').forEach((d) => {
      if (!q) { d.style.display = ''; return; }
      const title = d.querySelector('summary').textContent.toLowerCase();
      if (!title.includes(q)) { d._fill && d._fill(); }
      const hit = title.includes(q) || [...d.querySelectorAll('[data-search]')].some((e) => e.dataset.search.includes(q));
      d.style.display = hit ? '' : 'none';
      if (hit) d.open = true;
    });
  }
  $('#search').addEventListener('input', applySearch);

  /* ---------- barra superior ---------- */
  function syncSeg(sel, key, val) { $$(sel + ' button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[key] === val))); }
  function syncLocaleSeg() { syncSeg('#localeSeg', 'loc', App.locale); }
  function setPage(p) {
    if (App.page === p) return;
    App.page = p; App.selected = null;
    $$('.pages button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.page === p)));
    if (p === 'link' && App.device === 'desktop') { App.device = 'mobile'; syncSeg('#deviceSeg', 'dev', 'mobile'); }
    if (p === 'site' && App._siteDevice) { App.device = App._siteDevice; syncSeg('#deviceSeg', 'dev', App.device); }
    $('#themeSeg').style.display = p === 'site' ? '' : 'none';
    fitFrame(); renderPanels(); renderPreview();
  }
  $$('.pages button').forEach((b) => b.addEventListener('click', () => setPage(b.dataset.page)));
  $$('#localeSeg button').forEach((b) => b.addEventListener('click', () => { App.locale = b.dataset.loc; syncLocaleSeg(); renderPanels(); if (App.page === 'site') renderPreview(); }));
  $$('#deviceSeg button').forEach((b) => b.addEventListener('click', () => { App.device = b.dataset.dev; if (App.page === 'site') App._siteDevice = App.device; syncSeg('#deviceSeg', 'dev', App.device); fitFrame(); }));
  $$('#themeSeg button').forEach((b) => b.addEventListener('click', () => { App.theme = b.dataset.th; syncSeg('#themeSeg', 'th', App.theme); renderPreview(); }));
  $$('#modeSeg button').forEach((b) => b.addEventListener('click', () => { App.edit = b.dataset.mode === 'edit'; syncSeg('#modeSeg', 'mode', b.dataset.mode); postFrame({ type: 'mode', edit: App.edit }); }));
  function playIntro() {
    const I = App.state.site.intro;
    if (App.page === 'site' && I.enabled === false) return toast('La intro está apagada. Actívala en «Intro animada».', true);
    if (App.page === 'link' && App.state.link.intro.mode === 'off') return toast('La intro está apagada para Link. Elige una en el apartado «Intro».', true);
    App.scroll[App.page] = 0; renderPreview({ playIntro: true }); status('Reproduciendo la intro…');
  }
  $('#playIntro').onclick = playIntro;
  const menu = $('#exportMenu');
  $('#exportBtn').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('open'); };
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
  $$('#exportMenu [data-exp]').forEach((b) => b.addEventListener('click', () => { menu.classList.remove('open'); exportAction(b.dataset.exp); }));
  document.addEventListener('keydown', (e) => {
    const inField = e.target.closest && e.target.closest('input,textarea,select');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); exportAction(App.dirHandle ? 'folder' : 'json'); return; }
    if (inField) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? redo : undo)(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  });

  /* ---------- exportar / importar ---------- */
  function usedAssetMap() { const used = M.usedAssets(App.state); const out = {}; Object.keys(App.assets).forEach((k) => { if (used.has(k)) out[k] = App.assets[k]; }); return out; }
  function build(kind) {
    if (kind === 'site') return { name: 'index.html', path: 'index.html', type: 'text/html;charset=utf-8', text: WEBRender.renderSite(App.state, App.assets, { mode: 'export' }) };
    if (kind === 'link') return { name: 'link-index.html', path: 'link/index.html', type: 'text/html;charset=utf-8', text: WEBRender.renderLink(App.state, App.assets, { mode: 'export' }) };
    return { name: 'proyecto-web-demo.json', path: 'proyecto-web-demo.json', type: 'application/json', text: JSON.stringify({ format: 'web-demo-editor', version: 2, savedAt: new Date().toISOString(), site: App.state.site, link: App.state.link, assets: usedAssetMap() }) };
  }
  function download(f) { const url = URL.createObjectURL(new Blob([f.text], { type: f.type })); const a = h('a', { href: url, download: f.name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
  async function writeFolderFile(root, f) { const parts = String(f.path || f.name).split('/').filter(Boolean), file = parts.pop(); let dir = root; for (const part of parts) dir = await dir.getDirectoryHandle(part, { create: true }); const fh = await dir.getFileHandle(file, { create: true }); const w = await fh.createWritable(); await w.write(f.text); await w.close(); }
  async function exportAction(kind) {
    try {
      if (kind === 'folder') {
        if (!window.showDirectoryPicker) { toast('Tu navegador no permite elegir carpeta. Descargo los tres archivos.', true); kind = 'all'; }
        else {
          if (!App.dirHandle) App.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'web-export' });
          const files = [build('site'), build('link'), build('json')];
          for (const f of files) await writeFolderFile(App.dirHandle, f);
          toast(`Guardado en «${App.dirHandle.name}»: index.html, link/index.html y el proyecto`); status('Exportado a la carpeta', true); return;
        }
      }
      if (kind === 'all') { ['site', 'link', 'json'].forEach((k, i) => setTimeout(() => download(build(k)), i * 450)); toast('Descargando index.html, link-index.html y proyecto…'); return; }
      const f = build(kind); download(f); toast(`${f.name} exportado (${(f.text.length / 1048576).toFixed(1)} MB)`);
    } catch (e) { if (e && e.name === 'AbortError') return; console.error(e); toast('No se pudo exportar: ' + e.message, true); App.dirHandle = null; }
  }
  $('#importBtn').onclick = () => { const i = $('#fileImport'); i.value = ''; i.click(); };
  $('#fileImport').addEventListener('change', async () => {
    const files = [...$('#fileImport').files]; if (!files.length) return;
    for (const f of files) await importText(await f.text(), f.name);
  });
  async function importText(text, name) {
    try {
      const r = M.importAny(text, App.state, Object.assign({}, App.assets));
      beginChange();
      App.state = r.state; App.assets = r.assets;
      saveAssetsSoon(); saveSoon();
      if (r.part && r.part !== App.page) setPage(r.part); else { renderPanels(); renderPreview(); }
      toast(`${r.message} (${name})`);
    } catch (e) { console.error(e); toast(`No se pudo importar ${name}: ${e.message}`, true); }
  }
  document.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  document.addEventListener('drop', async (e) => { if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); for (const f of e.dataTransfer.files) { if (/\.(html?|json)$/i.test(f.name)) await importText(await f.text(), f.name); } });

  /* ---------- arranque ---------- */
  async function boot() {
    fitFrame(); renderPanels();
    await DB.open();
    const [saved, savedAssets] = await Promise.all([DB.get('state'), DB.get('assets')]);
    if (saved && saved.state) {
      try {
        App.state = M.normalize(saved.state);
        if (savedAssets) App.assets = Object.assign({}, DEFAULT.assets, savedAssets);
        App.theme = App.state.site.theme.default || 'light';
        toast('Borrador recuperado · ' + new Date(saved.at).toLocaleString());
      } catch (e) { console.warn(e); }
    } else DB.put('assets', App.assets);
    syncSeg('#themeSeg', 'th', App.theme);
    renderPanels(); renderPreview();
    status('Listo · haz clic en cualquier elemento de la vista previa para editarlo', true);
  }
  window.WEBEditor = { App, renderPreview, change, getP, setP, exportBuild: build, importText, setPage };
  boot();
})();
